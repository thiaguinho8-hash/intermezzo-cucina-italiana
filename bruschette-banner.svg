<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="980" fill="#faf6ec"/>

  <!-- Frame -->
  <rect x="16" y="16" width="688" height="948" fill="none" stroke="#c6a15b" stroke-width="1.4"/>
  <g fill="#c6a15b">
    <rect x="12" y="12" width="8" height="8"/>
    <rect x="700" y="12" width="8" height="8"/>
    <rect x="12" y="960" width="8" height="8"/>
    <rect x="700" y="960" width="8" height="8"/>
  </g>

  <!-- Header -->
  <text x="360" y="66" text-anchor="middle" font-size="13" letter-spacing="4" fill="#c6a15b">RISTORANTE ITALIANO</text>

  <g stroke="#c6a15b" stroke-width="1">
    <line x1="310" y1="86" x2="345" y2="86"/>
    <circle cx="360" cy="86" r="3" fill="#c6a15b" stroke="none"/>
    <line x1="375" y1="86" x2="410" y2="86"/>
  </g>

  <text x="360" y="148" text-anchor="middle" font-size="44">
    <tspan fill="#142a1e">Le Nostre </tspan><tspan fill="#6d2330" font-weight="700" font-style="italic">Bruschette</tspan>
  </text>
  <text x="360" y="180" text-anchor="middle" font-size="17" font-style="italic" fill="#6b6b5c">9 bruschette artisanales, du pomodoro classique à la porchetta</text>

  <line x1="90" y1="206" x2="630" y2="206" stroke="#c6a15b" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Items -->
  <g font-family="Georgia, 'Times New Roman', serif">

    <text x="90" y="286" font-size="20" font-weight="700" fill="#142a1e">Bruschetta al Pomodoro</text>
    <text x="630" y="286" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">4,00 €</text>
    <text x="90" y="308" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, ail, tomate</text>
    <line x1="90" y1="326" x2="630" y2="326" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="360" font-size="20" font-weight="700" fill="#142a1e">Bruschetta al Mascarpone</text>
    <text x="630" y="360" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">4,50 €</text>
    <text x="90" y="382" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, mascarpone, speck</text>
    <line x1="90" y1="400" x2="630" y2="400" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="434" font-size="20" font-weight="700" fill="#142a1e">Bruschetta al Provolone</text>
    <text x="630" y="434" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">4,50 €</text>
    <text x="90" y="456" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, provolone, salami piquant</text>
    <line x1="90" y1="474" x2="630" y2="474" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="508" font-size="20" font-weight="700" fill="#142a1e">Bruschetta alla Napoletana</text>
    <text x="630" y="508" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">5,00 €</text>
    <text x="90" y="530" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, mozzarella, anchois, olives, câpres</text>
    <line x1="90" y1="548" x2="630" y2="548" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="582" font-size="20" font-weight="700" fill="#142a1e">Bruschetta al Gorgonzola</text>
    <text x="630" y="582" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">5,50 €</text>
    <text x="90" y="604" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, gorgonzola, noix</text>
    <line x1="90" y1="622" x2="630" y2="622" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="656" font-size="20" font-weight="700" fill="#142a1e">Bruschetta Afumicata</text>
    <text x="630" y="656" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">5,50 €</text>
    <text x="90" y="678" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, mozzarella fumée, speck</text>
    <line x1="90" y1="696" x2="630" y2="696" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="730" font-size="20" font-weight="700" fill="#142a1e">Bruschetta alla Fontina Tartufata</text>
    <text x="630" y="730" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">6,00 €</text>
    <text x="90" y="752" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, fontina, speck, crème de truffes</text>
    <line x1="90" y1="770" x2="630" y2="770" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="804" font-size="20" font-weight="700" fill="#142a1e">Bruschetta alla Parmigiana</text>
    <text x="630" y="804" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">6,00 €</text>
    <text x="90" y="826" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, tomates, aubergines, mozzarella</text>
    <line x1="90" y1="844" x2="630" y2="844" stroke="#c6a15b" stroke-opacity="0.25" stroke-width="0.8"/>

    <text x="90" y="878" font-size="20" font-weight="700" fill="#142a1e">Bruschetta alla Porchetta</text>
    <text x="630" y="878" text-anchor="end" font-size="20" font-weight="700" fill="#6d2330">6,50 €</text>
    <text x="90" y="900" font-size="14.5" font-style="italic" fill="#6b6b5c">pain grillé, porchetta, tomate, mozzarella, champignons</text>

  </g>

  <!-- Footer -->
  <g stroke="#c6a15b" stroke-width="1">
    <line x1="310" y1="928" x2="345" y2="928"/>
    <circle cx="360" cy="928" r="3" fill="#c6a15b" stroke="none"/>
    <line x1="375" y1="928" x2="410" y2="928"/>
  </g>
  <text x="360" y="954" text-anchor="middle" font-size="11" letter-spacing="3" fill="#c6a15b">INTERMEZZO · RUE DES PRINCES 16, BRUXELLES</text>
</svg>
